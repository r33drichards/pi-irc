# Local stack: an IRC server, a dedicated mcp-js engine, and the pi IRC bot.
#
#   cp .env.example .env     # set a provider key
#   docker compose up --build
#   then connect an IRC client to localhost:6667 and join #pi
#
# On Railway the same image runs against the project's InspIRCd and its own
# mcp-js service; see README.
services:
  irc:
    image: ghcr.io/ergochat/ergo:stable
    ports:
      - "${IRC_PUBLIC_PORT:-6667}:6667"
    volumes:
      - ergo-data:/ircd

  # Configured entirely by mcp-js/config.toml (+ policies) mounted at /config.
  mcp-js:
    image: ${MCP_JS_IMAGE:-wholelottahoopla/mcp-js:0.21.0-rc.2}
    environment:
      MCP_V8_CONFIG: /config/config.toml
    volumes:
      - ./mcp-js:/config:ro
      - mcp-js-data:/data
    expose:
      - "3000"
    # A large depth-1 clone peaks near 6 GB; give the engine room.
    mem_limit: 7g

  pi-irc:
    build: .
    depends_on:
      - irc
      - mcp-js
    environment:
      MCP_JS_URL: http://mcp-js:3000
      IRC_SERVER: irc
      IRC_PORT: "6667"
      IRC_NICK: ${IRC_NICK:-pi}
      IRC_CHANNELS: ${IRC_CHANNELS:-#pi}
      IRC_CONTROL_CHANNEL: ${IRC_CONTROL_CHANNEL:-#pi}
      PI_DEFAULT_PROVIDER: ${PI_DEFAULT_PROVIDER:-anthropic}
      PI_DEFAULT_MODEL: ${PI_DEFAULT_MODEL:-claude-sonnet-5}
      PI_MODELS_JSON: ${PI_MODELS_JSON:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
    volumes:
      - pi-agent:/data/agent

volumes:
  ergo-data:
  mcp-js-data:
  pi-agent:
